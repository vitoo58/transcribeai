build: node --version
start: node server.js
env:
  - key: TRIAL_DAYS
    value: 7
  - key: MAX_FREE_TRANSCRIPTS
    value: 3
  - key: CORS_ORIGIN
    value: "*"
  - key: RATE_LIMIT_PER_MIN
    value: 60
  - key: MAX_ORDERS
    value: 50000
disk:
  name: transcribeai-data
  mountPath: /opt/render/project/src/data
  sizeGB: 1