<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — TranscribeAI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', Arial, sans-serif; background: #0B0E1A; color: #E8ECF4; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    .code { font-size: 96px; font-weight: 800; line-height: 1; }
    .msg { color: #94A3B8; margin: 16px 0 32px; }
    a, button { background: linear-gradient(135deg, #00D4AA, #10B981); color: #0B0E1A; font-weight: 600; border: none; border-radius: 12px; padding: 14px 32px; cursor: pointer; font-size: 16px; text-decoration: none; display: inline-block; }
  </style>
</head>
<body>
  <div>
    <p class="code gradient-text" style="background:linear-gradient(135deg,#00D4AA,#7C5CFC);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;">404</p>
    <p class="msg">The page you are looking for does not exist.</p>
    <a href="index.html" id="goto">Back to home</a>
  </div>
  <script>
    document.getElementById('goto').addEventListener('click', function(e){ e.preventDefault(); location.href = location.origin + location.pathname.replace(/[^/]*$/, 'index.html'); });
  </script>
</body>
</html>
